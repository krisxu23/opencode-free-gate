name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Resolve dependencies
        run: |
          go mod tidy
          go mod download

      # 仅提示不阻断：发现未格式化文件时打印清单
      - name: Check formatting
        run: |
          $files = gofmt -l .
          if ($files) { Write-Host "::warning::以下文件未通过 gofmt:"; $files } else { Write-Host "gofmt 检查通过" }

      - name: Run tests
        run: go test -tags "with_quic,with_utls,with_gvisor" ./...

      # 界面版：用 go-winres simply 一次性嵌入图标 + GUI清单
      # with_quic 启用 hysteria2/tuic，with_utls 启用 reality/uTLS 指纹
      - name: Build GUI exe
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 simply --icon app.ico --manifest gui.manifest --arch amd64
          go build -trimpath -tags "with_quic,with_utls,with_gvisor" -ldflags "-s -w -H windowsgui -X main.uiMode=gui" -o opencode-free-gate-gui.exe .
          Remove-Item -Path *.syso -Force

      # 控制台版：无图标无清单
      - name: Build console exe
        run: |
          go build -trimpath -tags "with_quic,with_utls,with_gvisor" -ldflags "-s -w -X main.uiMode=console" -o opencode-free-gate-console.exe .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-free-gate-windows-x64
          path: |
            opencode-free-gate-gui.exe
            opencode-free-gate-console.exe

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete exe-latest --yes --cleanup-tag || true
          gh release create exe-latest \
            --title "Windows EXE (latest)" \
            --notes "自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，源码 commit ${GITHUB_SHA::7}

          - opencode-free-gate-gui.exe：图形界面版（推荐，双击即用）
          - opencode-free-gate-console.exe：控制台版（排障用，输出纯日志）" \
            opencode-free-gate-gui.exe \
            opencode-free-gate-console.exe

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o opencode-free-gate.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-free-gate-windows-x64
          path: opencode-free-gate.exe
